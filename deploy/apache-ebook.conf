# Replace ebook.example.com and provision its certificate before enabling :443.
# Required Apache modules: ssl, proxy, proxy_http, headers, rewrite, reqtimeout.
<VirtualHost *:80>
    ServerName ebook.example.com
    DocumentRoot /var/lib/ebook-cli/acme
    <Directory /var/lib/ebook-cli/acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    # Plain HTTP serves only certificate challenges, never API operations.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$
    RewriteRule ^ - [R=404,L]
    <IfModule security2_module>
        SecAuditLogParts AZ
        SecDebugLogLevel 0
        SecAction "id:1000101,phase:1,pass,nolog,sanitiseRequestHeader:Authorization"
    </IfModule>
    ErrorLog ${APACHE_LOG_DIR}/ebook-error.log
    CustomLog ${APACHE_LOG_DIR}/ebook-access.log "%a %t %m %U %>s %B %D"
</VirtualHost>

<VirtualHost *:443>
    ServerName ebook.example.com
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/ebook.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ebook.example.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Real-IP early
    RequestHeader set X-Forwarded-Proto "https"
    RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
    LimitRequestBody 8192
    LimitRequestFields 30
    LimitRequestFieldSize 4096
    Timeout 130

    # Exact routes only: no project directory or local health/debug exposure.
    RewriteEngine On
    RewriteCond %{QUERY_STRING} !^$
    RewriteRule ^ - [R=404,L]
    RewriteCond %{REQUEST_URI} !^/(v1/operations|openapi\.json)$
    RewriteRule ^ - [R=404,L]
    ProxyPassMatch ^/v1/operations$ http://127.0.0.1:8791 connectiontimeout=5 timeout=125 retry=0
    ProxyPassReverse /v1/operations http://127.0.0.1:8791/v1/operations
    <Location /v1/operations>
        <LimitExcept POST>
            Require all denied
        </LimitExcept>
    </Location>
    Alias /openapi.json /var/lib/ebook-cli/public/openapi.json
    <Directory /var/lib/ebook-cli/public>
        Options None
        AllowOverride None
        Require all granted
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
    </Directory>
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Cache-Control "no-store"
    Header always set Referrer-Policy "no-referrer"

    # Preserve WAF rules, but exclude headers/bodies from the audit log.
    <IfModule security2_module>
        SecAuditLogParts AZ
        SecDebugLogLevel 0
        SecAction "id:1000102,phase:1,pass,nolog,sanitiseRequestHeader:Authorization"
    </IfModule>
    ErrorLog ${APACHE_LOG_DIR}/ebook-error.log
    # No query strings, Authorization, user-agent, referrer or request body.
    CustomLog ${APACHE_LOG_DIR}/ebook-access.log "%a %t %m %U %>s %B %D"
</VirtualHost>
